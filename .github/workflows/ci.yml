name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GHDL (LLVM backend, needed by cocotb)
        run: sudo apt-get update && sudo apt-get install -y ghdl-llvm gcc gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run all tests
        run: make test
      - name: C program regression
        run: make c_regress
